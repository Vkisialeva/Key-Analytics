name: KeyAnalytics CI/CD Pipeline

on:
  push:
    branches:
      - development
      - main

  pull_request:
    branches:
      - development
      - main

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run tests with coverage
        run: python -m pytest tests --cov=src --cov-report=term

      - name: Run e2e tests
        run: python -m pytest tests/e2e

      - name: Build Docker image
        run: docker build -t key-analytics:${{ github.sha }} .

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker tag key-analytics:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/key-analytics:${{ github.sha }}
          docker tag key-analytics:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/key-analytics:${GITHUB_SHA::12}

      - name: Push Docker image to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/key-analytics:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/key-analytics:${GITHUB_SHA::12}

