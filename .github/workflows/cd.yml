name: KeyAnalytics CD Pipeline

on:
  workflow_run:
    workflows: ["KeyAnalytics CI/CD Pipeline"]
    types:
      - completed
    branches:
      - development
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (defaults to the commit SHA)"
        required: false
        default: ""

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.2

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Deploy to staging
        run: |
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/ -n staging
          kubectl set image deployment/key-analytics key-analytics=${{ secrets.DOCKER_USERNAME }}/key-analytics:${{ steps.meta.outputs.image_tag }} -n staging
          kubectl rollout status deployment/key-analytics -n staging --timeout=300s
          kubectl get pods -n staging -l app=key-analytics